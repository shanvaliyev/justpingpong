<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>justpingpong</title>
    <script>
      // Pick the game's first court now, so its painting downloads alongside the app instead of
      // after it. Keep the ids and paths in sync with COURTS in src/game/court.ts.
      if (location.pathname === "/") {
        const courts = ["sakura", "seaside", "tokyo"];
        const court = courts[Math.floor(Math.random() * courts.length)];
        document.documentElement.dataset.court = court;
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.href = `/game/${court}-court.webp`;
        preload.fetchPriority = "high";
        document.head.append(preload);
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
