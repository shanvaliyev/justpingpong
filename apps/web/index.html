<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>justpingpong</title>
    <script>
      // Pick the game's first court now, so its images download alongside the app instead of
      // after it. Keep the ids and paths in sync with COURT_IDS in src/game/courts.ts and courtImages
      // in src/game/scenery.ts.
      if (location.pathname === "/") {
        const courts = ["sakura", "seaside", "tokyo"];
        const court = courts[Math.floor(Math.random() * courts.length)];
        document.documentElement.dataset.court = court;
        for (const image of ["backdrop", "floor", "floor-normal", "floor-rough"]) {
          const preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.href = `/game/courts/${court}-${image}.webp`;
          preload.fetchPriority = image === "backdrop" ? "high" : "auto";
          document.head.append(preload);
        }
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
